<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-labelledby="dynastiqLogoTitle">
  <title id="dynastiqLogoTitle">Dynastiq Antilles</title>
  <defs>
    <style>
      .navy { fill: #0E2233; }
      .teal { fill: #17827E; }
      .gold { fill: #E3A73A; }
      .steel { fill: #46617A; }
      .orange { fill: #E2542A; }
    </style>
  </defs>

  <!-- circuit traces, background -->
  <g fill="none" stroke="#17827E" stroke-width="2.5" stroke-linecap="round">
    <path d="M60 150 L30 150 L30 110" />
    <path d="M70 175 L20 175" />
    <path d="M330 140 L360 140 L360 95" />
    <path d="M320 168 L370 168" />
    <path d="M345 168 L345 200" />
  </g>
  <g class="teal">
    <circle cx="30" cy="110" r="5" />
    <circle cx="20" cy="175" r="5" />
    <circle cx="360" cy="95" r="5" />
    <circle cx="345" cy="200" r="5" />
  </g>

  <!-- crown -->
  <g>
    <polygon class="gold" points="
      92,120 108,168 138,132 152,190 172,140
      200,105 228,140 248,190 262,132 292,168 308,120
      308,158 92,158
    " />
    <rect class="gold" x="92" y="158" width="216" height="26" />
    <rect class="navy" x="92" y="171" width="216" height="4" opacity="0.35" />
    <g class="gold">
      <circle cx="92" cy="120" r="11" />
      <circle cx="200" cy="105" r="12" />
      <circle cx="308" cy="120" r="11" />
    </g>
  </g>

  <!-- crown sensor prongs -->
  <g stroke="#17827E" stroke-width="7" stroke-linecap="round">
    <line x1="163" y1="184" x2="163" y2="146" />
    <line x1="200" y1="184" x2="200" y2="132" />
    <line x1="237" y1="184" x2="237" y2="146" />
  </g>
  <g class="teal">
    <circle cx="163" cy="140" r="8" />
    <circle cx="200" cy="126" r="8" />
    <circle cx="237" cy="140" r="8" />
  </g>

  <!-- lens / iris -->
  <g>
    <circle class="navy" cx="200" cy="300" r="148" />
    <circle class="teal" cx="200" cy="300" r="128" />
    <circle class="navy" cx="200" cy="300" r="104" />
    <circle class="steel" cx="200" cy="300" r="80" />
    <circle class="teal" cx="200" cy="300" r="52" />
    <circle class="navy" cx="200" cy="300" r="34" />
    <path d="M 200 274 A 26 26 0 0 1 224 292" fill="none" stroke="#E3A73A" stroke-width="6" stroke-linecap="round" />
    <circle class="navy" cx="200" cy="300" r="14" />
  </g>

  <!-- wordmark -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <text x="200" y="452" font-size="58" letter-spacing="2" class="teal">DYNASTIQ</text>
    <text x="200" y="492" font-size="34" letter-spacing="6" class="orange">ANTILLES</text>
  </g>
</svg>
