<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>YK TV</title>
  <meta name="description" content="YK TV : regardez vos chaînes en direct depuis une playlist M3U / M3U8.">
  <meta name="theme-color" content="#0b0b0e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Layout: full-bleed hero + horizontally scrolling rows per category; player opens as a fullscreen layer. */
    :root {
      color-scheme: dark;
      --bg: #0b0b0e;
      --bg-2: #15151b;
      --card: #1c1c24;
      --line: #2b2b35;
      --text: #f2f1ee;
      --muted: #a3a2ab;
      --accent: #e8b04b;
      --accent-ink: #1a1306;
      --live: #e5484d;
      --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
      --body: "Jost", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --gutter: max(16px, 4vw);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--text); font: 400 15px/1.45 var(--body);
      -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- Top bar ---------- */
    .top {
      position: fixed; inset: 0 0 auto; z-index: 20;
      display: flex; align-items: center; gap: 20px;
      padding: calc(12px + env(safe-area-inset-top, 0px)) max(var(--gutter), env(safe-area-inset-right, 0px)) 12px max(var(--gutter), env(safe-area-inset-left, 0px));
      background: linear-gradient(to bottom, rgba(0,0,0,.75), transparent);
      transition: background .25s;
    }
    .top.solid { background: rgba(11,11,14,.96); }
    .logo { font: 400 30px/1 var(--display); letter-spacing: .04em; color: var(--accent); text-decoration: none; }
    .logo span { color: var(--text); }
    .tabs { display: flex; gap: 18px; }
    .tabs button {
      background: none; border: 0; padding: 6px 0; color: var(--muted); font-size: 14px;
    }
    .tabs button[aria-current="true"] { color: var(--text); font-weight: 500; }
    .top .grow { flex: 1; }
    .search {
      display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px;
      border: 1px solid transparent; border-radius: 6px; background: rgba(0,0,0,.35);
      transition: border-color .2s, width .25s; width: 220px;
    }
    .search:focus-within { border-color: var(--muted); }
    .search input { background: none; border: 0; outline: none; width: 100%; font-size: 14px; }
    .icon-btn {
      height: 38px; min-width: 38px; padding: 0 12px; border-radius: 6px; border: 0;
      background: rgba(255,255,255,.1); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 14px; text-decoration: none;
    }
    .icon-btn:hover { background: rgba(255,255,255,.18); }

    /* ---------- Hero ---------- */
    .hero {
      position: relative; min-height: min(78vh, 680px); display: flex; align-items: flex-end;
      padding: 120px max(var(--gutter), env(safe-area-inset-right, 0px)) 0 max(var(--gutter), env(safe-area-inset-left, 0px));
      overflow: hidden; isolation: isolate;
    }
    .hero-bg { position: absolute; inset: 0; z-index: -2; background: var(--bg-2); transition: background .6s; }
    .hero-art {
      position: absolute; right: 6vw; top: 50%; transform: translateY(-55%);
      width: min(42vw, 520px); aspect-ratio: 16/10; z-index: -1;
      display: grid; place-items: center; opacity: .95;
    }
    .hero-art img { max-width: 80%; max-height: 80%; object-fit: contain; filter: drop-shadow(0 20px 40px rgba(0,0,0,.5)); }
    .hero-art .initials { font: 400 clamp(80px, 14vw, 200px)/1 var(--display); color: rgba(255,255,255,.2); }
    .hero::after {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background:
        linear-gradient(to right, rgba(11,11,14,.92) 0%, rgba(11,11,14,.55) 45%, rgba(11,11,14,0) 75%),
        linear-gradient(to top, var(--bg) 0%, rgba(11,11,14,0) 40%);
    }
    .hero-content { max-width: 560px; padding-bottom: 72px; }
    .live {
      display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 3px;
      background: var(--live); color: #fff; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    }
    .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1.6s infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
    .hero h1 {
      font: 400 clamp(48px, 8vw, 104px)/.92 var(--display); letter-spacing: .01em; margin: 14px 0 10px;
      text-wrap: balance; text-shadow: 0 2px 20px rgba(0,0,0,.4);
    }
    .hero .meta { color: var(--muted); font-size: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
    .hero .meta b { color: var(--text); font-weight: 500; }
    .hero-actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
    .btn {
      height: 46px; padding: 0 22px; border-radius: 6px; border: 0; font-size: 16px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 10px;
    }
    .btn.play { background: var(--text); color: #111; }
    .btn.play:hover { background: #fff; }
    .btn.ghost { background: rgba(120,120,130,.45); color: var(--text); }
    .btn.ghost:hover { background: rgba(120,120,130,.6); }
    .btn.accent { background: var(--accent); color: var(--accent-ink); }
    .dots { display: flex; gap: 6px; margin-top: 26px; }
    .dots button { width: 22px; height: 4px; border: 0; padding: 0; border-radius: 2px; background: rgba(255,255,255,.3); }
    .dots button[aria-current="true"] { background: var(--text); }

    /* ---------- Rows ---------- */
    .rows { position: relative; z-index: 1; margin-top: -40px; padding-bottom: 60px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 34px; }
    .row h2 {
      margin: 0 0 10px; font-size: 19px; font-weight: 500; display: flex; align-items: baseline; gap: 12px;
      padding: 0 max(var(--gutter), env(safe-area-inset-right, 0px)) 0 max(var(--gutter), env(safe-area-inset-left, 0px));
    }
    .row h2 small { color: var(--muted); font-size: 13px; font-weight: 400; }
    .row h2 button { background: none; border: 0; color: var(--accent); font-size: 13px; padding: 4px 0; margin-left: auto; }
    .track-wrap { position: relative; }
    .track {
      display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
      padding: 6px max(var(--gutter), env(safe-area-inset-right, 0px)) 14px max(var(--gutter), env(safe-area-inset-left, 0px));
      scroll-padding-inline: var(--gutter);
    }
    .track::-webkit-scrollbar { display: none; }
    .arrow {
      position: absolute; top: 6px; bottom: 14px; width: calc(var(--gutter) - 4px); min-width: 40px; z-index: 2; border: 0;
      background: rgba(11,11,14,.7); color: var(--text); font-size: 30px; opacity: 0; transition: opacity .2s;
    }
    .arrow.l { left: 0; } .arrow.r { right: 0; }
    .track-wrap:hover .arrow { opacity: 1; }
    .arrow[hidden] { display: none; }
    @media (hover: none) { .arrow { display: none; } }

    .card {
      position: relative; flex: none; width: clamp(150px, 17vw, 250px); aspect-ratio: 16/9;
      border-radius: 6px; overflow: hidden; border: 0; padding: 0; scroll-snap-align: start;
      background: var(--card); text-align: left; transition: transform .2s ease, box-shadow .2s ease;
    }
    .grid .card { width: auto; }
    .card .art { position: absolute; inset: 0; display: grid; place-items: center; }
    .card .art > * { grid-area: 1 / 1; }
    .card .art img { max-width: 62%; max-height: 58%; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.35)); }
    .card .art .initials { font: 400 clamp(30px, 4vw, 48px)/1 var(--display); color: rgba(255,255,255,.55); letter-spacing: .03em; }
    .card .label {
      position: absolute; inset: auto 0 0; padding: 18px 10px 7px;
      background: linear-gradient(to top, rgba(0,0,0,.85), transparent);
      font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card .hover {
      position: absolute; top: 6px; right: 6px; display: flex; gap: 6px; opacity: 0; transition: opacity .2s;
    }
    .card .round {
      width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(11,11,14,.75); border: 1px solid rgba(255,255,255,.5); font-size: 14px; line-height: 1;
    }
    .card .round.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .card .playing { position: absolute; top: 7px; left: 7px; }
    .card:hover, .card:focus-visible { transform: scale(1.06); z-index: 3; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
    .card:hover .hover, .card:focus-visible .hover, .card .hover:has(.on) { opacity: 1; }
    @media (hover: none) { .card .hover { opacity: 1; } }

    /* ---------- Grid view (search / category / my list) ---------- */
    .page { padding: calc(96px + env(safe-area-inset-top, 0px)) max(var(--gutter), env(safe-area-inset-right, 0px)) 60px max(var(--gutter), env(safe-area-inset-left, 0px)); min-height: 70vh; }
    .page h1 { font: 400 clamp(36px, 5vw, 56px)/1 var(--display); margin: 0 0 6px; letter-spacing: .02em; }
    .page .sub { color: var(--muted); margin: 0 0 22px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 200px), 1fr)); gap: 14px 8px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
    .chip {
      height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--line); background: var(--bg-2); font-size: 13px;
    }
    .chip:hover { border-color: var(--muted); }
    .empty { color: var(--muted); padding: 40px 0; max-width: 46ch; }

    /* ---------- Player ---------- */
    .player { position: fixed; inset: 0; z-index: 50; background: #000; display: none; }
    .player.open { display: block; }
    .player video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
    .p-ui { position: absolute; inset: 0; pointer-events: none; transition: opacity .3s; }
    .player.idle .p-ui { opacity: 0; }
    .player.idle { cursor: none; }
    .p-top, .p-bottom { position: absolute; left: 0; right: 0; pointer-events: auto; }
    .p-top {
      top: 0; display: flex; align-items: center; gap: 14px;
      padding: calc(14px + env(safe-area-inset-top, 0px)) max(var(--gutter), env(safe-area-inset-right, 0px)) 40px max(var(--gutter), env(safe-area-inset-left, 0px));
      background: linear-gradient(to bottom, rgba(0,0,0,.8), transparent);
    }
    .p-top .title { min-width: 0; }
    .p-top .title strong { display: block; font: 400 28px/1 var(--display); letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-top .title span { color: var(--muted); font-size: 13px; }
    .p-bottom {
      bottom: 0; padding: 40px 0 calc(16px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(to top, rgba(0,0,0,.85), transparent);
    }
    .p-controls {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 0 max(var(--gutter), env(safe-area-inset-right, 0px)) 0 max(var(--gutter), env(safe-area-inset-left, 0px));
    }
    .p-controls .grow { flex: 1; }
    .p-controls input[type=range] { width: 110px; accent-color: var(--accent); }
    .p-strip { margin-top: 14px; }
    .p-strip .card { width: clamp(130px, 13vw, 190px); }
    .p-strip[hidden] { display: none; }
    .p-msg {
      position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
      pointer-events: none; font-size: 16px; color: #ddd;
    }
    .p-msg.error { color: #ff9a9d; }
    .spinner { width: 46px; height: 46px; border: 3px solid rgba(255,255,255,.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Dialog ---------- */
    dialog {
      width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); border: 1px solid var(--line); border-radius: 10px;
      background: var(--bg-2); color: var(--text); padding: 0;
    }
    dialog::backdrop { background: rgba(0,0,0,.7); }
    .dlg-head { padding: 18px 18px 14px; display: flex; align-items: center; border-bottom: 1px solid var(--line); }
    .dlg-head h2 { margin: 0; flex: 1; font: 400 28px/1 var(--display); letter-spacing: .03em; }
    .dlg-body { padding: 18px; display: grid; gap: 16px; }
    .dlg-body label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
    .field {
      width: 100%; padding: 11px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font-size: 14px;
    }
    textarea.field { min-height: 100px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    .inline { display: flex; gap: 8px; flex-wrap: wrap; }
    .inline .field { flex: 1; min-width: 180px; }
    .dlg-body .btn { height: 42px; font-size: 14px; }
    .or { text-align: center; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .14em; }
    .list-btns { display: grid; gap: 6px; }
    .list-btns .row-btn {
      display: flex; align-items: center; gap: 8px;
    }
    .list-btns .row-btn > button:first-child {
      flex: 1; text-align: left; height: 42px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .list-btns .row-btn > button:first-child:hover { border-color: var(--muted); }
    .note { font-size: 12px; color: var(--muted); margin: 0; }
    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
      z-index: 60; background: var(--text); color: #111; padding: 10px 16px; border-radius: 6px; font-size: 14px;
      max-width: calc(100vw - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.4);
    }
    .toast.error { background: var(--live); color: #fff; }

    @media (max-width: 760px) {
      .tabs { display: none; }
      .search { width: 40px; padding: 0 10px; }
      .search:focus-within { width: 100%; position: absolute; left: var(--gutter); right: var(--gutter); width: auto; background: var(--bg); z-index: 2; }
      .back-txt { display: none; }
      .hero { min-height: 72vh; }
      .hero-art { right: 50%; transform: translate(50%, -80%); width: 70vw; }
      .hero::after { background: linear-gradient(to top, var(--bg) 8%, rgba(11,11,14,.6) 55%, rgba(11,11,14,.3) 100%); }
      .hero-content { padding-bottom: 56px; }
      .p-controls input[type=range] { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <header class="top" id="top">
    <a class="logo" href="#" id="home" aria-label="YK TV, accueil">YK<span>TV</span></a>
    <nav class="tabs" aria-label="Sections">
      <button data-view="home" aria-current="true">Accueil</button>
      <button data-view="categories">Catégories</button>
      <button data-view="mylist">Ma liste</button>
    </nav>
    <div class="grow"></div>
    <label class="search" title="Rechercher">
      <span aria-hidden="true">⌕</span>
      <input id="q" type="search" placeholder="Chaîne, catégorie…" aria-label="Rechercher une chaîne">
    </label>
    <button class="icon-btn" id="openPlaylist" title="Changer de playlist">☰ <span class="back-txt">Playlist</span></button>
    <a class="icon-btn" href="../index.html" title="Retour au site">← <span class="back-txt">Site</span></a>
  </header>

  <main id="main"></main>

  <!-- Player -->
  <section class="player" id="player" aria-label="Lecteur" aria-hidden="true">
    <video id="video" playsinline></video>
    <div class="p-msg" id="pmsg"></div>
    <div class="p-ui">
      <div class="p-top">
        <button class="icon-btn" id="pClose" aria-label="Fermer le lecteur">←</button>
        <div class="title"><strong id="pName"></strong><span id="pGroup"></span></div>
        <div class="grow" style="flex:1"></div>
        <span class="live">Direct</span>
      </div>
      <div class="p-bottom">
        <div class="p-controls">
          <button class="icon-btn" id="pPrev" aria-label="Chaîne précédente" title="Précédente (↑)">⏮</button>
          <button class="icon-btn" id="pToggle" aria-label="Pause" title="Pause (Espace)">❚❚</button>
          <button class="icon-btn" id="pNext" aria-label="Chaîne suivante" title="Suivante (↓)">⏭</button>
          <button class="icon-btn" id="pMute" aria-label="Couper le son" title="Muet (M)">🔊</button>
          <input type="range" id="pVol" min="0" max="1" step="0.05" value="1" aria-label="Volume">
          <div class="grow"></div>
          <button class="icon-btn" id="pFav">+ Ma liste</button>
          <button class="icon-btn" id="pStripBtn" aria-expanded="false">Chaînes</button>
          <button class="icon-btn" id="pFs" aria-label="Plein écran" title="Plein écran (F)">⛶</button>
        </div>
        <div class="p-strip" id="pStrip" hidden><div class="track" id="pTrack"></div></div>
      </div>
    </div>
  </section>

  <dialog id="dlg">
    <div class="dlg-head">
      <h2>Mes playlists</h2>
      <button class="icon-btn" id="closeDlg" aria-label="Fermer">✕</button>
    </div>
    <div class="dlg-body">
      <label>Adresse de la playlist (M3U / M3U8)
        <div class="inline">
          <input class="field" id="urlInput" type="url" placeholder="https://exemple.com/playlist.m3u">
          <button class="btn accent" id="loadUrl">Charger</button>
        </div>
      </label>
      <div class="or">ou</div>
      <label>Importer un fichier .m3u
        <input class="field" id="fileInput" type="file" accept=".m3u,.m3u8,audio/x-mpegurl,application/vnd.apple.mpegurl,text/plain">
      </label>
      <div class="or">ou</div>
      <label>Coller le contenu
        <textarea class="field" id="pasteInput" placeholder="#EXTM3U&#10;#EXTINF:-1 tvg-logo=&quot;…&quot; group-title=&quot;Infos&quot;,Ma chaîne&#10;https://…/stream.m3u8"></textarea>
      </label>
      <button class="btn ghost" id="loadPaste">Utiliser ce contenu</button>

      <div id="savedWrap" hidden>
        <p class="note" style="margin-bottom:8px">Récemment utilisées</p>
        <div class="list-btns" id="saved"></div>
      </div>
      <div>
        <p class="note" style="margin-bottom:8px">Chaînes gratuites et légales (projet iptv-org)</p>
        <div class="list-btns" id="presets"></div>
      </div>
      <p class="note">
        N'utilisez que des flux que vous avez le droit de regarder. Si une chaîne refuse de se lancer,
        c'est souvent que son serveur bloque la lecture dans un navigateur : essayez-la dans VLC.
      </p>
    </div>
  </dialog>

  <div class="toast" id="toast" hidden role="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
  <script>
  (() => {
    const $ = (s, el = document) => el.querySelector(s);
    const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const store = {
      get(k, d) { try { const v = localStorage.getItem('yktv:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
      set(k, v) { try { localStorage.setItem('yktv:' + k, JSON.stringify(v)); } catch {} }
    };

    const PRESETS = [
      { name: '★ Bouquet Antilles : Guadeloupe, Martinique, Guyane + films', bundle: 'antilles' },
      { name: 'Guadeloupe', url: 'https://iptv-org.github.io/iptv/countries/gp.m3u' },
      { name: 'Martinique', url: 'https://iptv-org.github.io/iptv/countries/mq.m3u' },
      { name: 'Guyane', url: 'https://iptv-org.github.io/iptv/countries/gf.m3u' },
      { name: 'France', url: 'https://iptv-org.github.io/iptv/countries/fr.m3u' },
      { name: 'Belgique', url: 'https://iptv-org.github.io/iptv/countries/be.m3u' },
      { name: 'Suisse', url: 'https://iptv-org.github.io/iptv/countries/ch.m3u' },
      { name: 'Canada', url: 'https://iptv-org.github.io/iptv/countries/ca.m3u' },
      { name: 'Toutes les chaînes en français', url: 'https://iptv-org.github.io/iptv/languages/fra.m3u' },
      { name: 'Infos du monde entier', url: 'https://iptv-org.github.io/iptv/categories/news.m3u' },
      { name: 'Musique', url: 'https://iptv-org.github.io/iptv/categories/music.m3u' },
      { name: 'Films (toutes langues)', url: 'https://iptv-org.github.io/iptv/categories/movies.m3u' },
      { name: 'Démo (vidéos de test)', builtin: true },
    ];

    // Bouquet: several free playlists merged, each mapped to its own row
    const IPTV = 'https://iptv-org.github.io/iptv/';
    const ANTILLES_RE = /guadeloupe|gwada|martinique|madinina|guyane|antilles|cara[iï]b|karib|outre-?mer|1[eè]re/i;
    const BUNDLES = {
      antilles: {
        name: 'Bouquet Antilles',
        sources: [
          { url: IPTV + 'countries/gp.m3u', as: 'Guadeloupe' },
          { url: IPTV + 'countries/mq.m3u', as: 'Martinique' },
          { url: IPTV + 'countries/gf.m3u', as: 'Guyane' },
          { url: IPTV + 'languages/fra.m3u', pick: c => ANTILLES_RE.test(c.name), as: 'Antilles & Outre-mer', onlyNew: true },
          { url: IPTV + 'languages/fra.m3u', pick: c => c.groups.includes('Films'), as: 'Films' },
          { url: IPTV + 'languages/fra.m3u', pick: c => c.groups.includes('Séries'), as: 'Séries' },
          { url: IPTV + 'languages/fra.m3u', pick: c => c.groups.includes('Jeunesse') || c.groups.includes('Animation'), as: 'Jeunesse' },
          { url: IPTV + 'languages/fra.m3u', pick: c => c.groups.includes('Musique'), as: 'Musique' },
          { url: IPTV + 'languages/fra.m3u', pick: c => c.groups.includes('Infos'), as: 'Infos' },
        ],
        // Rows shown first, in this order
        order: ['Guadeloupe', 'Martinique', 'Guyane', 'Antilles & Outre-mer', 'Films', 'Séries', 'Jeunesse', 'Musique', 'Infos'],
      }
    };

    // iptv-org category names, shown in French
    const GROUP_FR = {
      animation: 'Animation', auto: 'Auto', business: 'Économie', classic: 'Classiques', comedy: 'Comédie',
      cooking: 'Cuisine', culture: 'Culture', documentary: 'Documentaires', education: 'Éducation',
      entertainment: 'Divertissement', family: 'Famille', general: 'Généralistes', kids: 'Jeunesse',
      legislative: 'Politique', lifestyle: 'Art de vivre', movies: 'Films', music: 'Musique', news: 'Infos',
      outdoor: 'Nature', relax: 'Détente', religious: 'Religion', science: 'Sciences', series: 'Séries',
      shop: 'Shopping', sports: 'Sport', travel: 'Voyage', weather: 'Météo', undefined: 'Autres chaînes'
    };

    const DEMO = `#EXTM3U
#EXTINF:-1 group-title="Films d'animation",Big Buck Bunny
https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8
#EXTINF:-1 group-title="Films d'animation",Sintel
https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4
#EXTINF:-1 group-title="Films d'animation",Elephants Dream
https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4
#EXTINF:-1 group-title="Science-fiction",Tears of Steel
https://test-streams.mux.dev/tos_ismc/main.m3u8
#EXTINF:-1 group-title="Tests techniques",Mire Apple HLS
https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8`;

    // ---------- M3U parser ----------
    function parseM3U(text) {
      const out = []; let cur = null;
      for (const raw of text.replace(/\r/g, '').split('\n')) {
        const line = raw.trim();
        if (!line) continue;
        if (line.startsWith('#EXTINF')) {
          const attrs = {};
          line.replace(/([\w-]+)="([^"]*)"/g, (_, k, v) => { attrs[k.toLowerCase()] = v; });
          const afterAttrs = line.lastIndexOf('"') + 1 || line.indexOf(':');
          const comma = line.indexOf(',', afterAttrs);
          const title = (comma >= 0 ? line.slice(comma + 1) : '').trim();
          const groups = [...new Set((attrs['group-title'] || '').split(';').map(s => s.trim()).filter(Boolean)
            .map(g => GROUP_FR[g.toLowerCase()] || g))];
          cur = { name: title || attrs['tvg-name'] || 'Sans nom', logo: attrs['tvg-logo'] || '', groups };
        } else if (line.startsWith('#EXTGRP:')) {
          if (cur && !cur.groups.length) cur.groups = [line.slice(8).trim()].filter(Boolean);
        } else if (!line.startsWith('#')) {
          const ch = cur || { name: decodeURIComponent(line.split('/').pop() || line), logo: '', groups: [] };
          if (!ch.groups.length) ch.groups = ['Autres chaînes'];
          ch.url = line;
          out.push(ch);
          cur = null;
        }
      }
      return out;
    }

    // ---------- State ----------
    let channels = [], byUrl = new Map(), groups = new Map();
    let favs = store.get('favs', []);          // ordered list of urls
    let recent = store.get('recent', []);      // most recent first
    let view = 'home', viewArg = null;
    let playlistName = '';
    let queue = [], current = null, hls = null;
    let heroList = [], heroIdx = 0, heroTimer = null;

    const main = $('#main'), video = $('#video'), player = $('#player');

    function toast(msg, isError) {
      const t = $('#toast'); t.textContent = msg; t.hidden = false; t.classList.toggle('error', !!isError);
      clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3800);
    }

    // Deterministic colors from the channel name
    function hue(str) { let x = 0; for (const c of str) x = (x * 31 + c.codePointAt(0)) >>> 0; return x % 360; }
    function artBg(name) {
      const a = hue(name), b = (a + 40) % 360;
      return `radial-gradient(120% 90% at 30% 20%, hsl(${a} 45% 34%), hsl(${b} 40% 14%) 70%)`;
    }
    function initials(name) {
      return name.replace(/\(.*?\)|\[.*?\]/g, '').replace(/[^\p{L}\p{N} ]/gu, ' ').split(/\s+/).filter(Boolean)
        .slice(0, 2).map(w => w[0]).join('').toUpperCase() || 'TV';
    }
    function cleanName(name) { return name.replace(/\s*\((\d{3,4}p|SD|HD|FHD|4K)\)|\s*\[[^\]]*\]/gi, '').trim() || name; }

    function setChannels(arr, name, order = []) {
      groupOrder = order;
      channels = arr; byUrl = new Map(arr.map(c => [c.url, c])); groups = new Map();
      for (const c of arr) for (const g of c.groups) { if (!groups.has(g)) groups.set(g, []); groups.get(g).push(c); }
      playlistName = name || '';
      pickHero();
      go('home');
    }

    // ---------- Cards & rows ----------
    function card(c, list) {
      const b = h('button', 'card');
      b.style.background = artBg(c.name);
      b.setAttribute('aria-label', `Regarder ${c.name}`);
      const art = h('div', 'art');
      const ini = h('span', 'initials', initials(c.name));
      art.appendChild(ini);
      if (c.logo) {
        const img = new Image(); img.alt = ''; img.loading = 'lazy'; img.decoding = 'async'; img.referrerPolicy = 'no-referrer';
        img.style.opacity = '0';
        img.onload = () => { ini.remove(); img.style.opacity = ''; };
        img.onerror = () => img.remove();
        img.src = c.logo;
        art.appendChild(img);
      }
      b.appendChild(art);
      b.appendChild(h('div', 'label', cleanName(c.name)));
      if (current && current.url === c.url) { const l = h('span', 'live playing', 'Direct'); b.appendChild(l); }
      const hov = h('div', 'hover');
      const fav = h('span', 'round' + (favs.includes(c.url) ? ' on' : ''), favs.includes(c.url) ? '✓' : '+');
      fav.setAttribute('role', 'button'); fav.title = favs.includes(c.url) ? 'Retirer de Ma liste' : 'Ajouter à Ma liste';
      fav.onclick = (e) => { e.stopPropagation(); toggleFav(c); };
      hov.appendChild(fav);
      b.appendChild(hov);
      b.onclick = () => play(c, list);
      return b;
    }

    function row(title, list, opts = {}) {
      if (!list.length) return null;
      const sec = h('section', 'row');
      const hd = h('h2', null, title);
      if (opts.count) hd.appendChild(h('small', null, `${list.length} chaînes`));
      if (opts.more && list.length > ROW_MAX) {
        const more = h('button', null, 'Tout voir ›'); more.onclick = opts.more; hd.appendChild(more);
      }
      sec.appendChild(hd);
      const wrap = h('div', 'track-wrap'), track = h('div', 'track');
      for (const c of list.slice(0, ROW_MAX)) track.appendChild(card(c, list));
      const l = h('button', 'arrow l', '‹'), r = h('button', 'arrow r', '›');
      l.setAttribute('aria-label', 'Défiler à gauche'); r.setAttribute('aria-label', 'Défiler à droite');
      l.onclick = () => track.scrollBy({ left: -track.clientWidth * .85, behavior: 'smooth' });
      r.onclick = () => track.scrollBy({ left: track.clientWidth * .85, behavior: 'smooth' });
      const upd = () => { l.hidden = track.scrollLeft < 10; r.hidden = track.scrollLeft + track.clientWidth >= track.scrollWidth - 10; };
      track.addEventListener('scroll', upd, { passive: true }); requestAnimationFrame(upd);
      wrap.append(l, track, r); sec.appendChild(wrap);
      return sec;
    }
    const ROW_MAX = 40;

    // ---------- Views ----------
    function go(v, arg = null) {
      view = v; viewArg = arg;
      document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', String(b.dataset.view === v)));
      clearInterval(heroTimer);
      main.innerHTML = '';
      if (v === 'home') renderHome();
      else if (v === 'categories') renderCategories();
      else if (v === 'mylist') renderGrid('Ma liste', favs.map(u => byUrl.get(u)).filter(Boolean),
        'Ajoutez des chaînes avec le bouton + sur chaque vignette pour les retrouver ici.');
      else if (v === 'group') renderGrid(arg, groups.get(arg) || [], 'Aucune chaîne.');
      else if (v === 'search') renderSearch(arg);
      window.scrollTo(0, 0);
      onScroll();
    }

    let groupOrder = [];
    function sortedGroups() {
      const rank = (g) => { const i = groupOrder.indexOf(g); return i < 0 ? 1e6 : i; };
      return [...groups.entries()].sort((a, b) => rank(a[0]) - rank(b[0]) || b[1].length - a[1].length || a[0].localeCompare(b[0], 'fr'));
    }

    function renderHome() {
      if (!channels.length) {
        main.appendChild(emptyPage('Aucune chaîne', 'Ajoutez une playlist pour remplir votre accueil.'));
        return;
      }
      main.appendChild(heroEl());
      const rows = h('div', 'rows');
      const add = (el) => el && rows.appendChild(el);
      add(row('Reprendre', recent.map(u => byUrl.get(u)).filter(Boolean)));
      add(row('Ma liste', favs.map(u => byUrl.get(u)).filter(Boolean), { more: () => go('mylist') }));
      const sg = sortedGroups();
      // If everything is in one group, show it plus an A-Z row
      for (const [g, list] of sg) add(row(g, list, { count: true, more: () => go('group', g) }));
      main.appendChild(rows);
    }

    function pickHero() {
      const withLogo = channels.filter(c => c.logo);
      const pool = (withLogo.length >= 3 ? withLogo : channels).slice();
      for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
      heroList = pool.slice(0, 5); heroIdx = 0;
    }

    function heroEl() {
      const sec = h('section', 'hero');
      sec.innerHTML = `
        <div class="hero-bg"></div>
        <div class="hero-art"></div>
        <div class="hero-content">
          <span class="live">En direct</span>
          <h1></h1>
          <div class="meta"></div>
          <div class="hero-actions">
            <button class="btn play">▶ Regarder</button>
            <button class="btn ghost fav-btn"></button>
          </div>
          <div class="dots" role="tablist" aria-label="Chaînes à la une"></div>
        </div>`;
      const dots = $('.dots', sec);
      heroList.forEach((_, i) => {
        const d = h('button'); d.setAttribute('aria-label', `Chaîne à la une ${i + 1}`);
        d.onclick = () => { heroIdx = i; paint(); restart(); };
        dots.appendChild(d);
      });
      if (heroList.length < 2) dots.remove();
      function paint() {
        const c = heroList[heroIdx]; if (!c) return;
        $('.hero-bg', sec).style.background = artBg(c.name);
        const art = $('.hero-art', sec); art.innerHTML = '';
        const ini = h('span', 'initials', initials(c.name)); art.appendChild(ini);
        if (c.logo) { const img = new Image(); img.alt = ''; img.referrerPolicy = 'no-referrer'; img.onload = () => { ini.remove(); art.appendChild(img); }; img.src = c.logo; }
        $('h1', sec).textContent = cleanName(c.name);
        const meta = $('.meta', sec); meta.innerHTML = '';
        meta.appendChild(h('b', null, c.groups.join(' · ')));
        if (playlistName) meta.appendChild(h('span', null, playlistName));
        meta.appendChild(h('span', null, `${channels.length} chaînes disponibles`));
        $('.play', sec).onclick = () => play(c, groups.get(c.groups[0]) || channels);
        const fb = $('.fav-btn', sec);
        const on = favs.includes(c.url);
        fb.textContent = on ? '✓ Dans ma liste' : '+ Ma liste';
        fb.onclick = () => { toggleFav(c); paint(); };
        dots.querySelectorAll('button').forEach((d, i) => d.setAttribute('aria-current', String(i === heroIdx)));
      }
      function restart() {
        clearInterval(heroTimer);
        if (heroList.length > 1 && !matchMedia('(prefers-reduced-motion: reduce)').matches)
          heroTimer = setInterval(() => { if (document.hidden || player.classList.contains('open')) return; heroIdx = (heroIdx + 1) % heroList.length; paint(); }, 9000);
      }
      paint(); restart();
      return sec;
    }

    function renderGrid(title, list, emptyMsg) {
      const p = h('section', 'page');
      p.appendChild(h('h1', null, title));
      p.appendChild(h('p', 'sub', list.length ? `${list.length} chaîne${list.length > 1 ? 's' : ''}` : ''));
      if (!list.length) p.appendChild(h('p', 'empty', emptyMsg));
      const g = h('div', 'grid');
      for (const c of list.slice(0, 600)) g.appendChild(card(c, list));
      p.appendChild(g);
      if (list.length > 600) p.appendChild(h('p', 'empty', `+${list.length - 600} autres : utilisez la recherche.`));
      main.appendChild(p);
    }

    function renderCategories() {
      const p = h('section', 'page');
      p.appendChild(h('h1', null, 'Catégories'));
      p.appendChild(h('p', 'sub', `${groups.size} catégories · ${channels.length} chaînes`));
      const chips = h('div', 'chips');
      for (const [g, list] of sortedGroups()) {
        const c = h('button', 'chip', `${g} · ${list.length}`); c.onclick = () => go('group', g); chips.appendChild(c);
      }
      p.appendChild(chips);
      main.appendChild(p);
    }

    function renderSearch(q) {
      const n = q.toLowerCase();
      const list = channels.filter(c => c.name.toLowerCase().includes(n) || c.groups.some(g => g.toLowerCase().includes(n)));
      renderGrid(`Résultats pour « ${q} »`, list, 'Aucune chaîne ne correspond. Vérifiez l\'orthographe ou essayez une catégorie.');
    }

    function emptyPage(title, msg) {
      const p = h('section', 'page');
      p.appendChild(h('h1', null, title));
      p.appendChild(h('p', 'empty', msg));
      const b = h('button', 'btn accent', 'Ajouter une playlist'); b.onclick = openDialog; p.appendChild(b);
      return p;
    }

    function toggleFav(c) {
      const i = favs.indexOf(c.url);
      if (i >= 0) { favs.splice(i, 1); toast(`${cleanName(c.name)} retirée de Ma liste`); }
      else { favs.unshift(c.url); toast(`${cleanName(c.name)} ajoutée à Ma liste`); }
      store.set('favs', favs);
      refreshCards();
      updatePlayerFav();
    }

    // Re-render the current view while keeping scroll positions
    function refreshCards() {
      if (player.classList.contains('open') && view === 'home') { needsRefresh = true; return; }
      const y = window.scrollY;
      const tracks = [...main.querySelectorAll('.track')].map(t => t.scrollLeft);
      const keepHero = heroIdx;
      main.innerHTML = '';
      if (view === 'home') { heroIdx = keepHero; renderHome(); }
      else go(view, viewArg);
      main.querySelectorAll('.track').forEach((t, i) => { if (tracks[i] != null) t.scrollLeft = tracks[i]; });
      window.scrollTo(0, y);
    }
    let needsRefresh = false;

    // ---------- Player ----------
    function play(c, list) {
      queue = (list && list.length ? list : channels);
      current = c;
      recent = [c.url, ...recent.filter(u => u !== c.url)].slice(0, 20);
      store.set('recent', recent);
      needsRefresh = true;

      $('#pName').textContent = cleanName(c.name);
      $('#pGroup').textContent = c.groups.join(' · ');
      document.title = `${cleanName(c.name)} · YK TV`;
      updatePlayerFav();
      openPlayer();
      fillStrip();
      msg('loading');

      if (hls) { hls.destroy(); hls = null; }
      video.removeAttribute('src'); video.load();
      const looksProgressive = /\.(mp4|webm|ogv|mp3|aac|m4a)(\?|$)/i.test(c.url);
      if (!looksProgressive && window.Hls && Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true, backBufferLength: 30 });
        hls.loadSource(c.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => start());
        let recovered = false;
        hls.on(Hls.Events.ERROR, (_, d) => {
          if (!d.fatal) return;
          if (d.type === Hls.ErrorTypes.MEDIA_ERROR && !recovered) { recovered = true; hls.recoverMediaError(); return; }
          if (d.details === 'manifestParsingError') { hls.destroy(); hls = null; video.src = c.url; start(); return; }
          msg('Cette chaîne ne répond pas. Elle est peut-être hors ligne ou bloquée par son serveur. Essayez la suivante avec ⏭.', true);
        });
      } else {
        video.src = c.url; start();
      }
    }
    function start() {
      video.play().catch(() => {
        // Autoplay with sound refused: start muted and let the user unmute
        video.muted = true; syncMute();
        video.play().then(() => toast('Son coupé par le navigateur : touchez 🔇 pour l\'activer.')).catch(() => msg('Touchez ❚❚ / ▶ pour lancer la lecture.'));
      });
    }
    function msg(m, isError) {
      const el = $('#pmsg'); el.classList.toggle('error', !!isError); el.innerHTML = '';
      if (m === 'loading') { el.appendChild(h('div', 'spinner')); el.appendChild(h('div', null, 'Connexion à la chaîne…')); }
      else if (m) el.textContent = m;
    }
    video.addEventListener('playing', () => { msg(''); syncToggle(); });
    video.addEventListener('pause', syncToggle);
    video.addEventListener('waiting', () => { if (current) msg('loading'); });
    video.addEventListener('error', () => { if (current && !hls && video.getAttribute('src')) msg('Impossible de lire cette chaîne. Essayez la suivante avec ⏭.', true); });

    function openPlayer() {
      if (player.classList.contains('open')) return;
      player.classList.add('open'); player.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      wake();
    }
    function closePlayer() {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      player.classList.remove('open'); player.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      if (hls) { hls.destroy(); hls = null; }
      video.pause(); video.removeAttribute('src'); video.load();
      current = null; document.title = 'YK TV';
      if (needsRefresh) { needsRefresh = false; refreshCards(); }
    }
    function step(d) {
      if (!queue.length) return;
      let i = queue.findIndex(c => current && c.url === current.url);
      i = i < 0 ? 0 : (i + d + queue.length) % queue.length;
      play(queue[i], queue);
    }
    function fillStrip() {
      const t = $('#pTrack'); t.innerHTML = '';
      for (const c of queue.slice(0, 80)) t.appendChild(card(c, queue));
      const act = [...t.children].findIndex((_, i) => queue[i] === current);
      if (act > 0) requestAnimationFrame(() => t.children[act].scrollIntoView({ inline: 'center', block: 'nearest' }));
    }
    function updatePlayerFav() {
      if (!current) return;
      const on = favs.includes(current.url);
      $('#pFav').textContent = on ? '✓ Ma liste' : '+ Ma liste';
    }
    function syncToggle() { const p = video.paused; $('#pToggle').textContent = p ? '▶' : '❚❚'; $('#pToggle').setAttribute('aria-label', p ? 'Lecture' : 'Pause'); }
    function syncMute() { $('#pMute').textContent = video.muted || video.volume === 0 ? '🔇' : '🔊'; }
    function fullscreen() {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else if (player.requestFullscreen) player.requestFullscreen().catch(() => {});
      else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
    }
    let idleT;
    function wake() {
      player.classList.remove('idle'); clearTimeout(idleT);
      idleT = setTimeout(() => { if (!video.paused && $('#pStrip').hidden) player.classList.add('idle'); }, 3200);
    }
    ['mousemove', 'touchstart', 'keydown'].forEach(ev => player.addEventListener(ev, wake, { passive: true }));
    video.addEventListener('click', () => { video.paused ? video.play() : video.pause(); });
    video.addEventListener('dblclick', fullscreen);

    $('#pClose').onclick = closePlayer;
    $('#pPrev').onclick = () => step(-1);
    $('#pNext').onclick = () => step(1);
    $('#pToggle').onclick = () => { video.paused ? video.play().catch(() => {}) : video.pause(); };
    $('#pMute').onclick = () => { video.muted = !video.muted; if (!video.muted && video.volume === 0) video.volume = .5; syncMute(); };
    $('#pVol').oninput = (e) => { video.volume = +e.target.value; video.muted = video.volume === 0; syncMute(); store.set('vol', video.volume); };
    $('#pFav').onclick = () => current && toggleFav(current);
    $('#pFs').onclick = fullscreen;
    $('#pStripBtn').onclick = () => {
      const s = $('#pStrip'); s.hidden = !s.hidden; $('#pStripBtn').setAttribute('aria-expanded', String(!s.hidden));
      if (!s.hidden) fillStrip();
    };
    const vol = store.get('vol', 1); video.volume = vol; $('#pVol').value = vol;

    // ---------- Playlists ----------
    async function loadFromUrl(url, name) {
      toast('Chargement de la playlist…');
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`le serveur a répondu ${res.status}`);
        const arr = parseM3U(await res.text());
        if (!arr.length) throw new Error('aucune chaîne trouvée dans ce fichier');
        remember({ name: name || url, url });
        store.set('source', { url, name: name || url });
        setChannels(arr, name);
        toast(`${arr.length} chaînes chargées`);
        return true;
      } catch (e) {
        toast(`Playlist non chargée : ${e.message === 'Failed to fetch' ? 'le serveur refuse l\'accès depuis un navigateur. Téléchargez le fichier puis importez-le.' : e.message}`, true);
        return false;
      }
    }
    async function loadBundle(key, silent) {
      const b = BUNDLES[key];
      if (!silent) toast(`Chargement : ${b.name}…`);
      const urls = [...new Set(b.sources.map(s => s.url))];
      const texts = new Map();
      await Promise.all(urls.map(u => fetch(u).then(r => r.ok ? r.text() : '').catch(() => '').then(t => texts.set(u, t))));
      const merged = new Map();
      for (const src of b.sources) {
        for (const c of parseM3U(texts.get(src.url) || '')) {
          if (src.pick && !src.pick(c)) continue;
          const ex = merged.get(c.url);
          if (ex && src.onlyNew) continue;
          if (ex) { if (!ex.groups.includes(src.as)) ex.groups.push(src.as); }
          else merged.set(c.url, { ...c, groups: [src.as] });
        }
      }
      const arr = [...merged.values()];
      if (!arr.length) {
        toast('Le bouquet n\'a pas pu être chargé. Vérifiez votre connexion internet puis réessayez.', true);
        return false;
      }
      store.set('source', { bundle: key, name: b.name });
      setChannels(arr, b.name, b.order);
      if (!silent) toast(`${arr.length} chaînes chargées`);
      return true;
    }

    function loadFromText(text, name, silent) {
      const arr = parseM3U(text);
      if (!arr.length) { toast('Aucune chaîne trouvée dans ce contenu. Il doit commencer par #EXTM3U.', true); return false; }
      store.set('source', { name, text: text.length < 2_000_000 ? text : null });
      setChannels(arr, name);
      if (!silent) toast(`${arr.length} chaînes chargées`);
      return true;
    }
    function remember(src) {
      const s = store.get('saved', []).filter(x => x.url !== src.url); s.unshift(src); store.set('saved', s.slice(0, 10));
    }

    const dlg = $('#dlg');
    function openDialog() {
      const mk = (label, onClick, onDelete) => {
        const r = h('div', 'row-btn'); const b = h('button', null, label); b.onclick = onClick; r.appendChild(b);
        if (onDelete) { const d = h('button', 'icon-btn', '✕'); d.setAttribute('aria-label', `Retirer ${label}`); d.onclick = onDelete; r.appendChild(d); }
        return r;
      };
      const p = $('#presets'); p.innerHTML = '';
      for (const pr of PRESETS) p.appendChild(mk(pr.name, async () => {
        if (pr.builtin) { loadFromText(DEMO, pr.name); dlg.close(); }
        else if (pr.bundle) { if (await loadBundle(pr.bundle)) dlg.close(); }
        else if (await loadFromUrl(pr.url, pr.name)) dlg.close();
      }));
      const saved = store.get('saved', []).filter(s => !PRESETS.some(x => x.url === s.url));
      $('#savedWrap').hidden = !saved.length;
      const sv = $('#saved'); sv.innerHTML = '';
      for (const s of saved) sv.appendChild(mk(s.name, async () => { if (await loadFromUrl(s.url, s.name)) dlg.close(); },
        () => { store.set('saved', store.get('saved', []).filter(x => x.url !== s.url)); openDialog(); }));
      if (!dlg.open) dlg.showModal();
    }
    $('#openPlaylist').onclick = openDialog;
    $('#closeDlg').onclick = () => dlg.close();
    $('#loadUrl').onclick = async () => { const u = $('#urlInput').value.trim(); if (u && await loadFromUrl(u)) dlg.close(); };
    $('#urlInput').onkeydown = (e) => { if (e.key === 'Enter') $('#loadUrl').click(); };
    $('#fileInput').onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      if (loadFromText(await f.text(), f.name.replace(/\.m3u8?$/i, ''))) dlg.close();
      e.target.value = '';
    };
    $('#loadPaste').onclick = () => { const t = $('#pasteInput').value; if (t.trim() && loadFromText(t, 'Ma playlist')) dlg.close(); };

    // ---------- Nav, search, keyboard ----------
    document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { $('#q').value = ''; go(b.dataset.view); });
    $('#home').onclick = (e) => { e.preventDefault(); $('#q').value = ''; go('home'); };
    let qT;
    $('#q').oninput = (e) => {
      clearTimeout(qT);
      qT = setTimeout(() => { const v = e.target.value.trim(); v ? go('search', v) : go('home'); }, 180);
    };
    function onScroll() { $('#top').classList.toggle('solid', window.scrollY > 40 || view !== 'home'); }
    window.addEventListener('scroll', onScroll, { passive: true });

    document.addEventListener('keydown', (e) => {
      if (dlg.open) return;
      const typing = e.target.matches('input:not([type=range]), textarea');
      if (player.classList.contains('open')) {
        if (e.key === 'Escape' && !document.fullscreenElement) closePlayer();
        else if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); step(1); }
        else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
        else if (e.key === 'f' || e.key === 'F') fullscreen();
        else if (e.key === 'm' || e.key === 'M') $('#pMute').click();
        else if (e.key === ' ' && !e.target.matches('button')) { e.preventDefault(); $('#pToggle').click(); }
        return;
      }
      if (typing) { if (e.key === 'Escape') e.target.blur(); return; }
      if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
    });

    // ---------- Boot ----------
    const src = store.get('source', null);
    if (!src || src.bundle) {
      loadBundle((src && src.bundle) || 'antilles', true).then(ok => { if (!ok) setChannels(parseM3U(DEMO), 'Démo'); });
    } else if (src.url) {
      loadFromUrl(src.url, src.name).then(ok => { if (!ok) setChannels(parseM3U(DEMO), 'Démo'); });
    } else if (src.text) loadFromText(src.text, src.name, true);
    else loadFromText(DEMO, 'Démo', true);
  })();
  </script>
</body>
</html>
