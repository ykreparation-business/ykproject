<meta name="description" content="Simulateur de gestion des créances et de recouvrement amiable — environnement de simulation, aucune opération réelle.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>/* Layout : rail de navigation à gauche, barre de commande en haut, plan de travail en grille ; bandeau de simulation permanent. */
:root {
  --bg: #060b17; --bg-2: #0a1222; --surface: #0e1729; --surface-2: #132038; --surface-3: #1a2a47;
  --line: #1e2d4a; --line-2: #2a3d61;
  --fg: #e6ecf7; --fg-2: #b6c2d9; --muted: #7d8db0;
  --accent: #3b82ff; --accent-2: #66a3ff; --accent-ink: #ffffff; --accent-soft: rgba(59,130,255,.14);
  --emerald: #19c48f; --emerald-soft: rgba(25,196,143,.14);
  --warn: #f2b632; --warn-soft: rgba(242,182,50,.14);
  --danger: #ff5a6e; --danger-soft: rgba(255,90,110,.14);
  --info: #8fa8ff; --info-soft: rgba(143,168,255,.14);
  --metal-1: #8e9bb3; --metal-2: #dfe5ef;
  --glow: 0 0 0 1px rgba(59,130,255,.25), 0 8px 30px -12px rgba(59,130,255,.45);
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 32px -18px rgba(0,0,0,.7);
  --font-display: 'Sora', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 10px; --r-sm: 7px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]):not([data-titan-theme]) {
    --bg: #eef2f8; --bg-2: #e6ebf3; --surface: #ffffff; --surface-2: #f5f7fb; --surface-3: #e9eef7;
    --line: #dbe2ee; --line-2: #c6d0e2; --fg: #0b1528; --fg-2: #334160; --muted: #5d6b88;
    --accent: #1d5fe6; --accent-2: #2f74ff; --accent-soft: rgba(29,95,230,.10);
    --emerald: #0a8f63; --emerald-soft: rgba(10,143,99,.10); --warn: #a86d00; --warn-soft: rgba(196,132,0,.12);
    --danger: #d1263d; --danger-soft: rgba(209,38,61,.09); --info: #4a5fd1; --info-soft: rgba(74,95,209,.10);
    --metal-1: #6b7891; --metal-2: #b8c2d4; --glow: 0 0 0 1px rgba(29,95,230,.2), 0 8px 24px -14px rgba(29,95,230,.4);
    --shadow: 0 1px 2px rgba(15,30,60,.06), 0 8px 24px -16px rgba(15,30,60,.25);
    color-scheme: light;
  }
}
:root[data-theme="light"]:not([data-titan-theme]), :root[data-titan-theme="light"] {
  --bg: #eef2f8; --bg-2: #e6ebf3; --surface: #ffffff; --surface-2: #f5f7fb; --surface-3: #e9eef7;
  --line: #dbe2ee; --line-2: #c6d0e2; --fg: #0b1528; --fg-2: #334160; --muted: #5d6b88;
  --accent: #1d5fe6; --accent-2: #2f74ff; --accent-soft: rgba(29,95,230,.10);
  --emerald: #0a8f63; --emerald-soft: rgba(10,143,99,.10); --warn: #a86d00; --warn-soft: rgba(196,132,0,.12);
  --danger: #d1263d; --danger-soft: rgba(209,38,61,.09); --info: #4a5fd1; --info-soft: rgba(74,95,209,.10);
  --metal-1: #6b7891; --metal-2: #b8c2d4; --glow: 0 0 0 1px rgba(29,95,230,.2), 0 8px 24px -14px rgba(29,95,230,.4);
  --shadow: 0 1px 2px rgba(15,30,60,.06), 0 8px 24px -16px rgba(15,30,60,.25);
  color-scheme: light;
}
:root[data-titan-theme="dark"] { color-scheme: dark; }
:root[data-titan-theme="hc"] {
  --bg: #000; --bg-2: #000; --surface: #000; --surface-2: #0b0b0b; --surface-3: #1a1a1a;
  --line: #ffffff; --line-2: #ffffff; --fg: #ffffff; --fg-2: #ffffff; --muted: #e0e0e0;
  --accent: #4db8ff; --accent-2: #8fd3ff; --accent-ink: #000; --accent-soft: rgba(77,184,255,.25);
  --emerald: #3dff9e; --emerald-soft: rgba(61,255,158,.2); --warn: #ffd23d; --warn-soft: rgba(255,210,61,.2);
  --danger: #ff6b7d; --danger-soft: rgba(255,107,125,.25); --info: #b3c6ff; --info-soft: rgba(179,198,255,.2);
  --glow: 0 0 0 2px #fff; --shadow: none; color-scheme: dark;
}
:root[data-titan-theme="hc"] body { font-size: 16px; }
:root[data-titan-theme="hc"] .card, :root[data-titan-theme="hc"] .btn { border-width: 2px; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg-2); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.55rem; font-weight: 600; }
h2 { font-size: 1.12rem; font-weight: 600; }
h3 { font-size: .95rem; font-weight: 600; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-size: .86em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.tiny { font-size: .74rem; }
.eyebrow { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Bandeau simulation ---------- */
.simbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; display: flex; align-items: center; justify-content: center; gap: 10px; padding-block: 5px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: repeating-linear-gradient(135deg, var(--warn-soft) 0 12px, transparent 12px 24px), var(--bg-2); border-bottom: 1px solid var(--line); font-size: .72rem; letter-spacing: .1em; font-weight: 600; color: var(--warn); text-align: center; text-transform: uppercase; }
.simbar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 10px var(--warn); flex: none; }
.simbar.kill { background: var(--danger); color: #fff; }
.simbar.kill .dot { background: #fff; box-shadow: none; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: calc(100vh - 28px); }
.shell.collapsed { grid-template-columns: 68px minmax(0, 1fr); }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 27px); height: calc(100vh - 27px); overflow-y: auto; background: var(--bg-2); border-right: 1px solid var(--line); padding: 14px 10px 20px; padding-left: max(10px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; gap: 10px; align-items: center; padding: 2px 6px 6px; }
.brand-txt b { font-family: var(--font-display); font-size: .86rem; letter-spacing: .06em; display: block; line-height: 1.15; background: linear-gradient(180deg, var(--fg), var(--metal-1)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand-txt span { font-size: .62rem; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.navgroup { display: flex; flex-direction: column; gap: 2px; }
.navgroup > .eyebrow { padding: 6px 10px 4px; font-size: .62rem; }
.navitem { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--r-sm); color: var(--fg-2); cursor: pointer; border: 0; background: none; text-align: left; width: 100%; font-size: .86rem; position: relative; }
.navitem:hover { background: var(--surface-2); color: var(--fg); }
.navitem.on { background: var(--accent-soft); color: var(--fg); }
.navitem.on::before { content: ""; position: absolute; left: -10px; top: 7px; bottom: 7px; width: 3px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.navitem svg { flex: none; opacity: .85; }
.navitem .badge { margin-left: auto; }
.collapsed .navitem span.lbl, .collapsed .brand-txt, .collapsed .navgroup > .eyebrow, .collapsed .side-foot { display: none; }
.collapsed .navitem { justify-content: center; }
.side-foot { margin-top: auto; padding: 10px; border: 1px solid var(--line); border-radius: var(--r); font-size: .72rem; color: var(--muted); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 27px); z-index: 40; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.search { flex: 1 1 200px; display: flex; align-items: center; gap: 8px; min-width: 0; height: 36px; padding: 0 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: text; }
.search kbd { margin-left: auto; }
kbd { white-space: nowrap; font-family: var(--font-mono); font-size: .7rem; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--fg-2); }
.clock { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-size: .78rem; white-space: nowrap; }
.clock .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--emerald); box-shadow: 0 0 0 0 var(--emerald); animation: pulse 2s infinite; }
.clock .pulse.off { background: var(--muted); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--emerald) 60%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.content { padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; max-width: 1480px; width: 100%; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.pagehead p { color: var(--muted); max-width: 70ch; margin-top: 4px; }
.pagehead .actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Primitives ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 16px 0; flex-wrap: wrap; }
.card-h .sub { color: var(--muted); font-size: .78rem; }
.card-b { padding: 13px 16px 16px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.span3 { grid-column: span 3; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sep { height: 1px; background: var(--line); margin: 6px 0; }
@media (max-width: 1180px) { .g6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .span3 { grid-column: span 2; } }
@media (max-width: 760px) {
  .shell, .shell.collapsed { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 70; left: 0; top: 0; height: 100%; width: 264px; transform: translateX(-102%); transition: transform .2s; padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
  .side.open { transform: none; box-shadow: 20px 0 60px rgba(0,0,0,.5); }
  .collapsed .navitem span.lbl, .collapsed .brand-txt, .collapsed .navgroup > .eyebrow, .collapsed .side-foot { display: revert; }
  .g2, .g3, .g4 { grid-template-columns: minmax(0, 1fr); } .g6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .span2, .span3 { grid-column: auto; }
  .hide-sm { display: none !important; }
  h1 { font-size: 1.3rem; }
}
@media (min-width: 761px) { .only-sm { display: none !important; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface-2); color: var(--fg); cursor: pointer; font-size: .84rem; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s, transform .05s; }
.btn:hover { background: var(--surface-3); border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: var(--glow); }
.btn.primary:hover { background: var(--accent-2); }
.btn.danger { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: #fff; }
.btn.ok { background: var(--emerald-soft); border-color: var(--emerald); color: var(--emerald); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); border-color: var(--line); }
.btn.sm { height: 28px; padding: 0 9px; font-size: .78rem; }
.btn.icon { width: 34px; padding: 0; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 0 10px; height: 32px; cursor: pointer; font-size: .78rem; color: var(--fg-2); }
.seg button.on { background: var(--accent-soft); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.seg button + button { border-left: 1px solid var(--line); }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 99px; font-size: .72rem; font-weight: 600; border: 1px solid transparent; white-space: nowrap; line-height: 1.6; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.plain::before { display: none; }
.t-accent { color: var(--accent-2); background: var(--accent-soft); }
.t-ok, .t-emerald { color: var(--emerald); background: var(--emerald-soft); }
.t-warn { color: var(--warn); background: var(--warn-soft); }
.t-danger { color: var(--danger); background: var(--danger-soft); }
.t-info { color: var(--info); background: var(--info-soft); }
.t-muted { color: var(--muted); background: var(--surface-2); }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: .66rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.badge.soft { background: var(--surface-3); color: var(--fg-2); }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: .76rem; color: var(--fg-2); font-weight: 500; }
.field .hint { font-size: .72rem; color: var(--muted); }
.input, select.input, textarea.input { height: 36px; padding: 0 10px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--bg-2); width: 100%; min-width: 0; }
textarea.input { height: auto; padding: 9px 10px; resize: vertical; line-height: 1.45; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type=range] { accent-color: var(--accent); width: 100%; }
input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: .85rem; }

/* ---------- KPI ---------- */
.kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
.kpi .v { font-family: var(--font-display); font-size: 1.45rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi .d { font-size: .74rem; color: var(--muted); }
.kpi svg.spark { position: absolute; right: 10px; bottom: 10px; opacity: .9; }
.kpi.alert { border-color: color-mix(in srgb, var(--danger) 50%, var(--line)); }
.kpi.flash .v { animation: flash .8s; }
@keyframes flash { 0% { color: var(--accent-2); text-shadow: 0 0 14px var(--accent); } 100% { color: inherit; text-shadow: none; } }

/* ---------- Tables ---------- */
.tablewrap { overflow-x: auto; border-top: 1px solid var(--line); }
table.t { width: 100%; border-collapse: collapse; font-size: .82rem; }
table.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
table.t th button { all: unset; cursor: pointer; }
table.t td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--surface-2); }
table.t td.r, table.t th.r { text-align: right; }
.pager { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; gap: 10px; flex-wrap: wrap; }

/* ---------- Drawer & modal ---------- */
.scrim { position: fixed; inset: 0; z-index: 80; background: rgba(2,6,15,.6); backdrop-filter: blur(3px); animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.drawer { position: fixed; z-index: 81; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--bg-2); border-left: 1px solid var(--line-2); overflow-y: auto; display: flex; flex-direction: column; animation: slide .2s ease-out; padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }
.drawer-h { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 16px 18px; background: var(--bg-2); border-bottom: 1px solid var(--line); }
.drawer-b { padding: 16px 18px 40px; display: flex; flex-direction: column; gap: 14px; }
.modal { position: fixed; z-index: 90; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 32px)); max-height: calc(100% - 40px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.7); animation: pop .15s; }
.modal.wide { width: min(820px, calc(100% - 32px)); }
@keyframes pop { from { transform: translate(-50%, -48%); opacity: 0; } }
.modal-h { padding: 18px 20px 6px; display: flex; justify-content: space-between; gap: 10px; }
.modal-b { padding: 8px 20px 18px; display: flex; flex-direction: column; gap: 12px; }
.modal-f { padding: 12px 20px 18px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line); flex-wrap: wrap; }

/* ---------- Palette ---------- */
.palette { top: 12vh; transform: translate(-50%, 0); }
@keyframes popt { from { opacity: 0; } }
.palette { animation: popt .12s; }
.palette input { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; height: 52px; font-size: 1rem; background: transparent; padding: 0 18px; width: 100%; }
.palette input:focus { outline: none; }
.pal-list { max-height: 50vh; overflow-y: auto; padding: 6px; }
.pal-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; width: 100%; border: 0; background: none; text-align: left; }
.pal-item.sel, .pal-item:hover { background: var(--accent-soft); }
.pal-item .k { font-size: .66rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; width: 78px; flex: none; }

/* ---------- Toasts ---------- */
.toasts { position: fixed; z-index: 100; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; width: min(380px, calc(100% - 32px)); }
.toast { padding: 11px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line-2); box-shadow: var(--shadow); font-size: .84rem; display: flex; gap: 10px; align-items: flex-start; animation: slide .2s; border-left: 3px solid var(--accent); }
.toast.danger { border-left-color: var(--danger); } .toast.ok { border-left-color: var(--emerald); } .toast.warn { border-left-color: var(--warn); }

/* ---------- Legal checklist ---------- */
.checks { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
.chk { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 7px 10px; font-size: .8rem; border-bottom: 1px solid var(--line); }
.chk:last-child { border-bottom: 0; }
